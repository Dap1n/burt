[package]
name = "burt"
version = "0.1.0"
edition = "2024"
description = "Beta Utility for Recording & Tracing"

[lib]
crate-type = ["cdylib"]

[dependencies]
burt_macros = { path = "./burt_macros" }
chrono = "0.4"
enigo = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
