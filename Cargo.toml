[package]
name = "burt"
version = "0.2.0"
edition = "2024"
rust-version = "1.95.0"
description = "Beta Utility for Recording & Tracing"

[lib]
crate-type = ["cdylib"]

[dependencies]
burt_command = { path = "./burt_command" }
smallvec = "1.16.6"
detour = "0.11.1"
pe-sigscan = { version = "0.4", features = ["memchr"] }
portable-atomic = { version = "1.15", default-features = false, features = [
    "float",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
